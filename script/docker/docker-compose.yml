version: "3.4"

name: aiptower-system

# 仅部署应用容器；PostgreSQL / Redis / Nacos 外接，连接信息见 application-{profile}.yaml，密钥见项目根目录 aiptower.env
# 路径均相对 --project-directory（仓库根目录），见 Docker-HOWTO.md
services:
  server:
    container_name: aiptower-server
    build:
      context: ./aiptower-server/
    image: aiptower-server
    restart: unless-stopped
    ports:
      - "48090:48090" # 与 aip-hub(48080) 区分
    env_file:
      - aiptower.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      JAVA_OPTS:
        ${JAVA_OPTS:-
          -Xms512m
          -Xmx512m
          -Djava.security.egd=file:/dev/./urandom
        }
    extra_hosts:
      - "host.docker.internal:host-gateway"

  admin:
    container_name: aiptower-admin
    build:
      context: ./aiptower-ui-admin
      args:
        NODE_ENV:
          ENV=${NODE_ENV:-production}
          PUBLIC_PATH=${PUBLIC_PATH:-/}
          VUE_APP_TITLE=${VUE_APP_TITLE:-AIP-Tower}
          VUE_APP_BASE_API=${VUE_APP_BASE_API:-/prod-api}
          VUE_APP_APP_NAME=${VUE_APP_APP_NAME:-/}
          VUE_APP_TENANT_ENABLE=${VUE_APP_TENANT_ENABLE:-true}
          VUE_APP_CAPTCHA_ENABLE=${VUE_APP_CAPTCHA_ENABLE:-true}
          VUE_APP_DOC_ENABLE=${VUE_APP_DOC_ENABLE:-true}
          VUE_APP_BAIDU_CODE=${VUE_APP_BAIDU_CODE:-fadc1bd5db1a1d6f581df60a1807f8ab}
    image: aiptower-admin
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server
